<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- The link preview card (share-card.jpg, 1200 x 630), shown when a page link is pasted into
     email, chat or social. Render: node tools/share-card/render.js (with the local server on 8765). -->
<link rel="stylesheet" href="../../social/fonts/fonts.css">
<style>
  html, body { margin: 0; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif;
    background: #0b0f1e url('../../namdesert.jpg') center 62% / cover no-repeat; }
  .card::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(6,9,22,.86) 0%, rgba(6,9,22,.55) 55%, rgba(6,9,22,.15) 100%); }
  .in { position: absolute; left: 92px; top: 132px; right: 92px; }
  .logo { width: 150px; height: auto; display: block; margin-bottom: 42px; filter: drop-shadow(0 4px 14px rgba(0,0,0,.45)); }
  h1 { margin: 0; color: #fff; font: 700 76px/1.05 Inter, sans-serif; letter-spacing: -.01em; }
  h1 sup { font-size: .55em; vertical-align: .75em; line-height: 0; }
  .tag { margin: 20px 0 0; color: rgba(255,255,255,.9); font: 400 34px/1.2 'Source Serif 4', Georgia, serif; font-style: italic; letter-spacing: .01em; }
  .tag span { color: #f1e303; font-style: normal; padding: 0 .35em; }
  .url { margin: 30px 0 0; color: #f1e303; font: 600 28px/1 Inter, sans-serif; letter-spacing: .01em; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
    background: linear-gradient(90deg, #c62828 0 33.3%, #2e7d32 33.3% 66.6%, #005ba5 66.6%); }
</style></head>
<body><div class="card">
  <div class="in">
    <svg class="logo" viewBox="96 10 78 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#c62828" d="m 128.26,30.59 16.45,10.09 v 13.56 l 10.4,6.49 16.65,-9.33 -11.22,-5.77 V 11.52 Z"/>
      <path fill="#005ba5" d="m 129.76,61.42 11.95,-7.19 V 42.35 L 126.8,33.17 v 12.2 l -29.56,17.29 32.52,18.75 z"/>
      <path fill="#2e7d32" d="m 155.02,64.21 -11.82,-7.38 -10.44,6.28 v 18.23 l 10.72,-6.3 29.88,17.89 V 53.94 Z"/>
    </svg>
    <h1>Ic<sup>2</sup> Research Institute</h1>
    <p class="tag">Information<span>~</span>Connection<span>~</span>Curiosity</p>
    <p class="url">eequalsicsquared.com</p>
  </div>
  <div class="bar"></div>
</div></body></html>
