<!-- Metatron's Cube in the site's quark-color palette, turning once every 90 seconds.
     The same figure as the Validation page header; shared so title panels can
     load it as an image. Motion stops for visitors who ask for reduced motion. -->
<style>
  #spin { transform-origin: 100px 100px; animation: turn 90s linear infinite; }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #spin { animation: none; } }
</style>
