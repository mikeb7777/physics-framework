<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Animation Test</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; padding: 2rem; }
    .card {
        background: #8B0000;
        color: white;
        padding: 2rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        max-width: 600px;
    }
    .card h2 { color: #f1e303; margin-bottom: 0.5rem; }
    .card p { opacity: 0.9; line-height: 1.7; }
    </style>
</head>
<body>

    <div class="card" data-aos="fade-up">
        <h2>Card One</h2>
        <p>This card should slide up when the page loads.</p>
    </div>

    <div class="card" data-aos="fade-up" data-aos-delay="150">
        <h2>Card Two</h2>
        <p>This card should slide up 150ms after the first.</p>
    </div>

    <div class="card" data-aos="fade-up" data-aos-delay="300">
        <h2>Card Three</h2>
        <p>This card should slide up 300ms after the first.</p>
    </div>

    <div class="card" data-aos="fade-up" data-aos-delay="450">
        <h2>Card Four</h2>
        <p>This card should slide up 450ms after the first.</p>
    </div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        duration: 800,
        once: true,
        offset: 50
    });
</script>
</body>
</html>
